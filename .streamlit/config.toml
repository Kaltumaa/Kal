[theme]
base = "light"
primaryColor = "#2F7046"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#FAFAF7"
textColor = "#121212"
borderColor = "#E8E8E2"
dataframeBorderColor = "#E8E8E2"
dataframeHeaderBackgroundColor = "#FAFAF7"
font = "sans-serif"
baseRadius = "14px"

[theme.sidebar]
backgroundColor = "#FBFBF8"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#121212"
primaryColor = "#2F7046"
borderColor = "#E8E8E2"

[server]
headless = true
runOnSave = true

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"

[theme]
base = "light"
primaryColor = "#14532D"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#52525B"
borderColor = "#F4F4F5"
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
baseRadius = "6px"

[theme.sidebar]
backgroundColor = "#14532D"
secondaryBackgroundColor = "#14532D"
textColor = "#F7F1E3"
primaryColor = "#F2B134"
borderColor = "#2F6B47"

[server]
headless = true

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"

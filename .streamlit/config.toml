[theme]
base = "light"
primaryColor = "#18181B"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#52525B"
borderColor = "#F4F4F5"
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
baseRadius = "6px"

[theme.sidebar]
backgroundColor = "#FFFFFF"

[server]
headless = true

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"
